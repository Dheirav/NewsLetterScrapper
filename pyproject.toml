[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-scrapper"
version = "0.1.0"
description = "Self-hosted AI-powered daily intelligence briefing system"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "services*", "scripts*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Integration tests share one session-scoped engine. Without this, async
# fixtures get a per-function event loop while the engine's asyncpg
# connections belong to another, and every savepoint fails with
# "another operation is in progress".
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: requires a live PostgreSQL with pgvector",
]
