# Curated RSS sources for the daily intelligence pipeline.
#
# tier: 1 = elite / premium reliability  2 = good  3 = general
# domain: used to organise newsletter sections
#
# To add a new source, append an entry under the appropriate group.

sources:

  # ── World / Politics ─────────────────────────────────────────────────────
  - name: "Reuters"
    url: "https://feeds.reuters.com/reuters/topNews"
    domain: "World"
    tier: 1

  - name: "Associated Press"
    url: "https://rsshub.app/apnews/topics/apf-topnews"
    domain: "World"
    tier: 1

  - name: "BBC News"
    url: "https://feeds.bbci.co.uk/news/rss.xml"
    domain: "World"
    tier: 1

  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    domain: "World"
    tier: 2

  - name: "The Guardian"
    url: "https://www.theguardian.com/world/rss"
    domain: "World"
    tier: 2

  - name: "Foreign Affairs"
    url: "https://www.foreignaffairs.com/rss.xml"
    domain: "World"
    tier: 1

  # ── Technology ────────────────────────────────────────────────────────────
  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/index"
    domain: "Technology"
    tier: 1

  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
    domain: "Technology"
    tier: 2

  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
    domain: "Technology"
    tier: 1

  - name: "Wired"
    url: "https://www.wired.com/feed/rss"
    domain: "Technology"
    tier: 2

  - name: "Hacker News (top)"
    url: "https://hnrss.org/frontpage"
    domain: "Technology"
    tier: 2

  # ── Science ───────────────────────────────────────────────────────────────
