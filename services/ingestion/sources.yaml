# Curated RSS sources for the daily intelligence pipeline.
#
# tier:        1 = elite / premium reliability  2 = good  3 = general
# domain:      used to organise newsletter sections
# source_type: "news" | "analysis" | "research"
# weight:      ranking influence score
#              news t1=1.0, t2=0.9 | analysis t1=0.7, t2=0.6 | research t1=0.4, t2=0.3
#
# To add a new source, append an entry under the appropriate group.

