[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-scrapper"
version = "0.1.0"
description = "Self-hosted AI-powered daily intelligence briefing system"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "services*", "scripts*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
