# Curated RSS sources for the daily intelligence pipeline.
#
# tier:        1 = elite / premium reliability  2 = good  3 = general
# domain:      used to organise newsletter sections
# source_type: "news" | "analysis" | "research"
# weight:      ranking influence score
#              news t1=1.0, t2=0.9 | analysis t1=0.7, t2=0.6 | research t1=0.4, t2=0.3
#
# To add a new source, append an entry under the appropriate group.

sources:

  # -- World / Politics ------------------------------------------------------


  - name: "BBC News"
    url: "https://feeds.bbci.co.uk/news/rss.xml"
    domain: "World"
    tier: 1
    source_type: "news"
    weight: 1.0

  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    domain: "World"
    tier: 2
    source_type: "news"
    weight: 0.9

  - name: "The Guardian"
    url: "https://www.theguardian.com/world/rss"
    domain: "World"
    tier: 2
    source_type: "news"
    weight: 0.9

  - name: "Foreign Affairs"
    url: "https://www.foreignaffairs.com/rss.xml"
    domain: "World"
    tier: 1
    source_type: "analysis"
    weight: 0.7

  # Replaces Reuters: feeds.reuters.com no longer resolves. 140 entries, 3/3 scraped full.
  - name: "Deutsche Welle"
    url: "https://rss.dw.com/rdf/rss-en-all"
    domain: "World"
    tier: 1
    source_type: "news"
    weight: 1.0

  # Replaces Associated Press: its rsshub proxy returns 403. 3/3 scraped full.
  - name: "ABC News (Australia)"
    url: "https://www.abc.net.au/news/feed/51120/rss.xml"
    domain: "World"
    tier: 1
    source_type: "news"
    weight: 1.0

  # Non-anglophone perspective; the surviving mix skewed heavily UK/US.
  - name: "France 24"
    url: "https://www.france24.com/en/rss"
    domain: "World"
    tier: 2
    source_type: "news"
    weight: 0.9

